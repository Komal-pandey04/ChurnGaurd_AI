version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: churnguard-backend
    ports:
      - "8000:8000"
    environment:
      - CHURNGUARD_CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
    volumes:
      - churnguard-data:/app/data
      - churnguard-artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: churnguard-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  churnguard-data:
  churnguard-artifacts:
